name: TCF slot checker

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub may run it a few minutes late)
  workflow_dispatch:         # lets you run it manually from the Actions tab
    inputs:
      test_alert:
        description: "Send a test notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tcf-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for early TCF Canada slots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CUTOFF_DATE: "2026-12-21"
          TEST_ALERT: ${{ inputs.test_alert }}
        run: python3 check.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "slot-checker"
            git config user.email "slot-checker@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen slots"
            git push
          fi
